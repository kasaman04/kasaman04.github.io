<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop Checker - Mobile</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    :root { color-scheme: light; }
    body {
      font-family: Inter, "Noto Sans JP", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue",
        Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .line-clamp-2{
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900">
  <div class="min-h-screen max-w-md mx-auto px-4 pb-10">

    <!-- Header -->
    <div class="pt-6 pb-4 flex items-start justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Shop Checker</h1>
        <p class="text-slate-600 text-sm mt-1">Mobile Edition</p>
      </div>

      <button id="reset-btn"
        class="hidden shrink-0 inline-flex items-center justify-center w-10 h-10 rounded-2xl bg-white shadow-sm border border-slate-200 active:scale-[0.98]"
        title="リセット"
        type="button">
        <i class="fa-solid fa-rotate-left text-slate-700"></i>
      </button>
    </div>

    <!-- Start Screen -->
    <section id="start-screen" class="mt-2">
      <div class="bg-white border border-slate-200 shadow-sm rounded-2xl p-4">
        <h2 class="text-base font-semibold">CSVデータを貼り付け</h2>

        <p class="text-sm text-slate-600 mt-2 leading-relaxed">
          KeepaなどのCSVを開き、「すべて選択 → コピー」して貼り付けてください。<br />
          列が減っていても動作するようにしています。
        </p>

        <textarea id="csv-input"
          class="mt-3 w-full h-44 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-slate-300"
          placeholder="ここにCSV（または表のコピペ）を貼り付け"></textarea>

        <div class="mt-3 flex items-center gap-2">
          <button id="start-btn"
            class="flex-1 inline-flex items-center justify-center gap-2 rounded-xl bg-slate-900 text-white py-2.5 text-sm font-semibold shadow-sm active:scale-[0.99]"
            type="button">
            <i class="fa-solid fa-play"></i>
            解析スタート
          </button>

          <button id="clear-input-btn"
            class="inline-flex items-center justify-center w-12 h-11 rounded-xl bg-white border border-slate-200 shadow-sm active:scale-[0.99]"
            title="入力クリア"
            type="button">
            <i class="fa-solid fa-eraser text-slate-700"></i>
          </button>
        </div>

        <div class="mt-3 text-xs text-slate-500">
          最低限おすすめ：<span class="font-semibold">ASIN</span> / <span class="font-semibold">商品名</span><br>
          任意：ブランド / カテゴリ: サブ / 画像 / 発売日 / 価格（新品/Amazon/BuyBox/現在価格など）
        </div>
      </div>
    </section>

    <!-- Loading -->
    <section id="loading-screen" class="hidden mt-6">
      <div class="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 flex items-center gap-3">
        <div class="w-8 h-8 rounded-full border-2 border-slate-200 border-t-slate-900 animate-spin"></div>
        <div>
          <div class="font-semibold">解析中...</div>
          <div class="text-sm text-slate-600">データ量が多い場合、少し時間がかかります。</div>
        </div>
      </div>
    </section>

    <!-- Main -->
    <section id="main-screen" class="hidden mt-4">

      <!-- Filters -->
      <div class="bg-white border border-slate-200 shadow-sm rounded-2xl p-4">
        <div class="grid grid-cols-1 gap-4">

          <!-- Brand -->
          <div>
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-semibold">Brand</h3>
              <button id="brand-clear-btn"
                class="text-xs text-slate-600 underline decoration-slate-300 hover:text-slate-900"
                type="button">
                クリア
              </button>
            </div>

            <input id="brand-search" type="text"
              class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300"
              placeholder="ブランド検索" />

            <div id="brand-tags" class="mt-2 flex flex-wrap gap-2 max-h-28 overflow-auto no-scrollbar"></div>
          </div>

          <!-- Category -->
          <div>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <h3 class="text-sm font-semibold">Category</h3>

                <!-- ALL View -->
                <button id="all-view-btn"
                  class="px-3 py-1.5 rounded-full text-xs font-semibold border shadow-sm active:scale-[0.99]"
                  type="button">
                  ALL View
                </button>
              </div>

              <button id="subcat-clear-btn"
                class="text-xs text-slate-600 underline decoration-slate-300 hover:text-slate-900"
                type="button">
                クリア
              </button>
            </div>

            <input id="subcat-search" type="text"
              class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300"
              placeholder="カテゴリ（サブ）検索" />

            <div id="subcat-tags" class="mt-2 flex flex-wrap gap-2 max-h-28 overflow-auto no-scrollbar"></div>
          </div>
        </div>
      </div>

      <!-- Results -->
      <div class="mt-4" id="results-container"></div>
    </section>
  </div>

  <script>
    // -----------------------------
    // Column aliases（列名ゆらぎ吸収）
    // -----------------------------
    const COLUMN_ALIASES = {
      asin: ["ASIN", "asin"],
      title: ["商品名", "商品 名", "タイトル", "title", "Title", "商品"],
      brand: ["ブランド", "Brand", "brand", "メーカー", "メーカー名"],
      subCat: ["カテゴリ: サブ", "カテゴリ:サブ", "カテゴリ（サブ）", "カテゴリ サブ", "Category", "Sub Category", "SubCategory"],
      image: ["画像", "Image", "image", "画像URL", "画像 URL", "imageUrl"],
      releaseDate: ["発売日", "Release Date", "releaseDate", "発売 日"],
      price: [
        "新品: 現在価格",
        "新品 現在価格",
        "新品価格",
        "Amazon: 現在価格",
        "Amazon 現在価格",
        "Buy Box 🚚: 現在価格",
        "Buy Box: 現在価格",
        "BuyBox: 現在価格",
        "現在価格",
        "価格"
      ],
      purchasesLastMonth: ["先月の購入", "先月 購入", "Last month purchases", "購入数(先月)"],
    };

    // -----------------------------
    // State
    // -----------------------------
    const state = {
      data: {}, // brand -> subCat -> items[]
      uniqueBrands: [],
      uniqueSubCats: [],
      filters: {
        brandSearch: "",
        subCatSearch: "",
        selectedBrand: null,
        selectedSubCat: null,

        // ALL View: 押したらカテゴリ別に全表示（カテゴリタグを押さなくても出る）
        allView: false,

        // ALL View OFFに戻す時に復元する用（内部）
        _savedSubCat: null
      }
    };

    // -----------------------------
    // DOM refs
    // -----------------------------
    const startScreen = document.getElementById("start-screen");
    const loadingScreen = document.getElementById("loading-screen");
    const mainScreen = document.getElementById("main-screen");

    const csvInput = document.getElementById("csv-input");
    const startBtn = document.getElementById("start-btn");
    const clearInputBtn = document.getElementById("clear-input-btn");
    const resetBtn = document.getElementById("reset-btn");

    const brandSearch = document.getElementById("brand-search");
    const subCatSearch = document.getElementById("subcat-search");
    const brandClearBtn = document.getElementById("brand-clear-btn");
    const subCatClearBtn = document.getElementById("subcat-clear-btn");

    const allViewBtn = document.getElementById("all-view-btn");

    const brandTags = document.getElementById("brand-tags");
    const subCatTags = document.getElementById("subcat-tags");
    const resultsContainer = document.getElementById("results-container");

    // -----------------------------
    // Helpers
    // -----------------------------
    function normalizeKey(k) {
      if (typeof k !== "string") return "";
      return k.replace(/^\uFEFF/, "").trim(); // BOM除去 + trim
    }

    function normalizeRowKeys(row) {
      const out = {};
      for (const [k, v] of Object.entries(row || {})) {
        out[normalizeKey(k)] = v;
      }
      return out;
    }

    function getField(row, aliases) {
      for (const key of aliases) {
        const v = row[key];
        if (v === 0) return "0";
        if (v === null || v === undefined) continue;
        const s = String(v).trim();
        if (s !== "") return s;
      }
      return "";
    }

    function firstImage(urls) {
      if (!urls) return "";
      const s = String(urls).trim();
      if (!s) return "";
      const first = s.split(";")[0].trim();
      return first;
    }

    function parsePrice(value) {
      if (value === null || value === undefined) return null;
      const raw = String(value).trim();
      if (!raw) return null;
      if (raw === "-") return null;

      // "1,292" / "¥1292" / "1292円" などを想定
      const digits = raw.replace(/[^\d]/g, "");
      if (!digits) return null;
      const n = Number(digits);
      return Number.isFinite(n) ? n : null;
    }

    function formatYen(n) {
      try { return "¥" + Number(n).toLocaleString("ja-JP"); }
      catch { return "¥" + String(n); }
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function amazonUrl(asin) {
      const a = String(asin || "").trim();
      if (!a) return "";
      return `https://www.amazon.co.jp/dp/${encodeURIComponent(a)}`;
    }

    function getBrandColors(brand) {
      const s = String(brand || "Unknown");
      let hash = 0;
      for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
      const hue = hash % 360;
      return {
        bg: `hsl(${hue} 70% 92%)`,
        border: `hsl(${hue} 60% 70%)`,
        text: `hsl(${hue} 35% 28%)`
      };
    }

    function isAnyFilterActive() {
      const f = state.filters;
      return !!(f.brandSearch || f.subCatSearch || f.selectedBrand || f.selectedSubCat || f.allView);
    }

    function updateAllViewButtonUI() {
      const on = !!state.filters.allView;
      // オン：オレンジ / オフ：白
      allViewBtn.style.background = on ? "rgb(249 115 22)" : "rgb(255 255 255)";
      allViewBtn.style.borderColor = on ? "rgb(249 115 22)" : "rgb(226 232 240)";
      allViewBtn.style.color = on ? "white" : "rgb(15 23 42)";
    }

    // -----------------------------
    // UI transitions
    // -----------------------------
    function showStart() {
      startScreen.classList.remove("hidden");
      loadingScreen.classList.add("hidden");
      mainScreen.classList.add("hidden");
      resetBtn.classList.add("hidden");
    }

    function showLoading() {
      startScreen.classList.add("hidden");
      loadingScreen.classList.remove("hidden");
      mainScreen.classList.add("hidden");
      resetBtn.classList.add("hidden");
    }

    function showMain() {
      startScreen.classList.add("hidden");
      loadingScreen.classList.add("hidden");
      mainScreen.classList.remove("hidden");
      resetBtn.classList.remove("hidden");
    }

    // -----------------------------
    // Data processing
    // -----------------------------
    function processData(rows) {
      const grouped = {};
      const brands = new Set();
      const subCats = new Set();

      let validCount = 0;

      for (const rawRow of rows || []) {
        const row = normalizeRowKeys(rawRow);

        const asin = getField(row, COLUMN_ALIASES.asin);
        const title = getField(row, COLUMN_ALIASES.title);
        const brandRaw = getField(row, COLUMN_ALIASES.brand);
        const subCatRaw = getField(row, COLUMN_ALIASES.subCat);

        // 最低限、ASIN/商品名がどちらも空の行はスキップ（空行対策）
        if (!asin && !title) continue;

        const brand = (brandRaw || "Unknown").trim() || "Unknown";
        const subCat = (subCatRaw || "その他").trim() || "その他";

        const imageUrl = firstImage(getField(row, COLUMN_ALIASES.image));
        const releaseDate = getField(row, COLUMN_ALIASES.releaseDate);
        const priceVal = parsePrice(getField(row, COLUMN_ALIASES.price));
        const purchasesLastMonth = getField(row, COLUMN_ALIASES.purchasesLastMonth);

        const item = {
          asin,
          title: title || asin || "(no title)",
          brand,
          subCat,
          imageUrl,
          releaseDate,
          price: priceVal,
          purchasesLastMonth
        };

        if (!grouped[brand]) grouped[brand] = {};
        if (!grouped[brand][subCat]) grouped[brand][subCat] = [];
        grouped[brand][subCat].push(item);

        brands.add(brand);
        subCats.add(subCat);
        validCount++;
      }

      if (validCount === 0) {
        alert("有効なデータが見つかりませんでした。ヘッダ行（ASIN/商品名など）が含まれているか確認してください。");
        resetAll();
        return;
      }

      state.data = grouped;
      state.uniqueBrands = Array.from(brands).sort((a,b) => a.localeCompare(b, "ja"));
      state.uniqueSubCats = Array.from(subCats).sort((a,b) => a.localeCompare(b, "ja"));

      // 初期状態：カテゴリを選ぶか ALL View で出す（好みがあれば変更可）
      state.filters.selectedBrand = null;
      state.filters.selectedSubCat = null;
      state.filters.allView = false;
      state.filters._savedSubCat = null;

      brandSearch.value = "";
      subCatSearch.value = "";
      state.filters.brandSearch = "";
      state.filters.subCatSearch = "";

      updateAllViewButtonUI();
      renderFilterTags();
      renderResults();
    }

    // -----------------------------
    // Filters UI
    // -----------------------------
    function countItems({ brand = null, subCat = null } = {}) {
      let c = 0;
      const data = state.data || {};
      for (const [b, subMap] of Object.entries(data)) {
        if (brand && b !== brand) continue;
        for (const [s, items] of Object.entries(subMap || {})) {
          if (subCat && s !== subCat) continue;
          c += (items || []).length;
        }
      }
      return c;
    }

    function renderFilterTags() {
      // Brand tags
      brandTags.innerHTML = "";
      const bSearch = state.filters.brandSearch.toLowerCase();

      for (const b of state.uniqueBrands) {
        if (bSearch && !String(b).toLowerCase().includes(bSearch)) continue;

        const colors = getBrandColors(b);
        const selected = state.filters.selectedBrand === b;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "px-3 py-1.5 rounded-full text-xs font-semibold border shadow-sm active:scale-[0.99]";
        btn.style.background = selected ? colors.border : colors.bg;
        btn.style.borderColor = colors.border;
        btn.style.color = colors.text;

        btn.textContent = `${b} (${countItems({ brand: b })})`;

        btn.onclick = () => {
          state.filters.selectedBrand = (state.filters.selectedBrand === b) ? null : b;
          renderFilterTags();
          renderResults();
        };

        brandTags.appendChild(btn);
      }

      // SubCat tags
      subCatTags.innerHTML = "";
      const sSearch = state.filters.subCatSearch.toLowerCase();

      for (const s of state.uniqueSubCats) {
        if (sSearch && !String(s).toLowerCase().includes(sSearch)) continue;

        const selected = state.filters.selectedSubCat === s;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "px-3 py-1.5 rounded-full text-xs font-semibold border shadow-sm active:scale-[0.99]";
        btn.style.background = selected ? "rgb(251 207 232)" : "rgb(255 241 242)";
        btn.style.borderColor = "rgb(244 114 182)";
        btn.style.color = "rgb(159 18 57)";

        btn.textContent = `${s} (${countItems({ subCat: s })})`;

        btn.onclick = () => {
          // ALL View中にカテゴリを押したら、通常モードに戻してそのカテゴリで表示
          if (state.filters.allView) {
            state.filters.allView = false;
            state.filters._savedSubCat = null;
            updateAllViewButtonUI();
          }

          state.filters.selectedSubCat = (state.filters.selectedSubCat === s) ? null : s;
          renderFilterTags();
          renderResults();
        };

        subCatTags.appendChild(btn);
      }
    }

    // -----------------------------
    // Results rendering (分岐)
    // -----------------------------
    function renderResults() {
      if (state.filters.allView) return renderResultsCategoryFirst();
      return renderResultsBrandFirst();
    }

    // 通常モード：カテゴリタグを選択したときに表示（ALL Viewを押さないと全部は出ない）
    function renderResultsBrandFirst() {
      resultsContainer.innerHTML = "";

      const f = state.filters;

      // 通常モードは「カテゴリを押さないと出ない」仕様にする
      if (!f.selectedSubCat) {
        const hint = document.createElement("div");
        hint.className = "bg-white border border-slate-200 shadow-sm rounded-2xl p-5 text-sm text-slate-700";
        hint.innerHTML = `
          <div class="font-semibold">カテゴリを選択してください</div>
          <div class="text-slate-600 mt-1 text-sm leading-relaxed">
            下のカテゴリタグを押すか、<span class="font-semibold">ALL View</span> を押すと全カテゴリをまとめて表示できます。
          </div>
        `;
        resultsContainer.appendChild(hint);
        return;
      }

      const bSearch = f.brandSearch.toLowerCase();
      const sSearch = f.subCatSearch.toLowerCase();

      const data = state.data || {};
      const brandList = Object.keys(data).sort((a,b) => a.localeCompare(b, "ja"));

      let totalShown = 0;

      for (const brand of brandList) {
        if (f.selectedBrand && brand !== f.selectedBrand) continue;
        if (bSearch && !brand.toLowerCase().includes(bSearch)) continue;

        const subMap = data[brand] || {};
        const subList = Object.keys(subMap).sort((a,b) => a.localeCompare(b, "ja"));

        // selectedSubCat に一致するものだけ
        const subCat = f.selectedSubCat;
        if (!subMap[subCat]) continue;

        // カテゴリ検索がかかっていて一致しないならスキップ
        if (sSearch && !subCat.toLowerCase().includes(sSearch)) continue;

        const items = subMap[subCat] || [];
        if (items.length === 0) continue;

        // Brand section
        const section = document.createElement("div");
        section.className = "bg-white border border-slate-200 shadow-sm rounded-2xl overflow-hidden mb-4";

        const header = document.createElement("button");
        header.type = "button";
        header.className = "w-full px-4 py-3 flex items-center justify-between gap-3 text-left";
        const colors = getBrandColors(brand);

        header.innerHTML = `
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span class="inline-block w-2.5 h-2.5 rounded-full" style="background:${colors.border}"></span>
              <div class="font-bold truncate">${escapeHtml(brand)}</div>
            </div>
            <div class="text-xs text-slate-600 mt-0.5">${items.length} items</div>
          </div>
          <i class="fa-solid fa-chevron-down text-slate-500 shrink-0" style="transform:rotate(180deg)"></i>
        `;

        const body = document.createElement("div");
        body.className = "px-4 pb-4";
        body.style.display = "block"; // 選択カテゴリの結果なのでデフォルト展開

        header.onclick = () => {
          const isOpen = body.style.display !== "none";
          body.style.display = isOpen ? "none" : "block";
          header.querySelector("i").style.transform = isOpen ? "rotate(0deg)" : "rotate(180deg)";
        };

        // Subheader（選択カテゴリ名）
        const subHeader = document.createElement("div");
        subHeader.className = "mt-4 mb-2 flex items-baseline justify-between gap-3";
        subHeader.innerHTML = `
          <div class="font-semibold text-sm">${escapeHtml(subCat)}</div>
          <div class="text-xs text-slate-500">${items.length}件</div>
        `;
        body.appendChild(subHeader);

        const grid = document.createElement("div");
        grid.className = "grid grid-cols-1 gap-2";

        for (const item of items) {
          const card = renderItemCard(item, { showBrandChip: false });
          grid.appendChild(card);
          totalShown++;
        }

        body.appendChild(grid);
        section.appendChild(header);
        section.appendChild(body);
        resultsContainer.appendChild(section);
      }

      if (totalShown === 0) {
        const empty = document.createElement("div");
        empty.className = "bg-white border border-slate-200 shadow-sm rounded-2xl p-5 text-sm text-slate-600";
        empty.textContent = "該当データがありません。フィルタ条件を変更するか、入力データを確認してください。";
        resultsContainer.appendChild(empty);
      }
    }

    // ALL View モード：全カテゴリをカテゴリ別に表示（カテゴリを押さなくても出る）
    function renderResultsCategoryFirst() {
      resultsContainer.innerHTML = "";

      const f = state.filters;
      const bSearch = f.brandSearch.toLowerCase();
      const sSearch = f.subCatSearch.toLowerCase();

      const data = state.data || {};
      const subCats = state.uniqueSubCats || [];

      let totalShown = 0;

      for (const subCat of subCats) {
        if (sSearch && !String(subCat).toLowerCase().includes(sSearch)) continue;

        // このカテゴリの全アイテム（ブランド横断）
        const items = [];
        for (const [brand, subMap] of Object.entries(data)) {
          if (f.selectedBrand && brand !== f.selectedBrand) continue;
          if (bSearch && !brand.toLowerCase().includes(bSearch)) continue;

          const arr = (subMap && subMap[subCat]) ? subMap[subCat] : [];
          for (const it of arr) items.push(it);
        }

        if (items.length === 0) continue;

        const section = document.createElement("div");
        section.className = "bg-white border border-slate-200 shadow-sm rounded-2xl overflow-hidden mb-4";

        const header = document.createElement("button");
        header.type = "button";
        header.className = "w-full px-4 py-3 flex items-center justify-between gap-3 text-left";
        header.innerHTML = `
          <div class="min-w-0">
            <div class="font-bold truncate">${escapeHtml(subCat)}</div>
            <div class="text-xs text-slate-600 mt-0.5">${items.length} items</div>
          </div>
          <i class="fa-solid fa-chevron-down text-slate-500 shrink-0" style="transform:rotate(180deg)"></i>
        `;

        const body = document.createElement("div");
        body.className = "px-4 pb-4";
        body.style.display = "block"; // ALL View は「出す」が目的なのでデフォルト展開

        header.onclick = () => {
          const isOpen = body.style.display !== "none";
          body.style.display = isOpen ? "none" : "block";
          header.querySelector("i").style.transform = isOpen ? "rotate(0deg)" : "rotate(180deg)";
        };

        const grid = document.createElement("div");
        grid.className = "grid grid-cols-1 gap-2 mt-4";

        // 見やすさのためブランド→商品名で軽くソート
        items.sort((a, b) => {
          const ab = String(a.brand || "").localeCompare(String(b.brand || ""), "ja");
          if (ab !== 0) return ab;
          return String(a.title || "").localeCompare(String(b.title || ""), "ja");
        });

        for (const item of items) {
          const card = renderItemCard(item, { showBrandChip: true });
          grid.appendChild(card);
          totalShown++;
        }

        body.appendChild(grid);
        section.appendChild(header);
        section.appendChild(body);
        resultsContainer.appendChild(section);
      }

      if (totalShown === 0) {
        const empty = document.createElement("div");
        empty.className = "bg-white border border-slate-200 shadow-sm rounded-2xl p-5 text-sm text-slate-600";
        empty.textContent = "該当データがありません。フィルタ条件を変更するか、入力データを確認してください。";
        resultsContainer.appendChild(empty);
      }
    }

    function renderItemCard(item, { showBrandChip }) {
      const card = document.createElement("div");
      card.className = "rounded-2xl border border-slate-200 bg-slate-50 p-3 flex gap-3 items-start active:scale-[0.995] cursor-pointer";
      const url = amazonUrl(item.asin);

      const imgHtml = item.imageUrl
        ? `<img src="${escapeHtml(item.imageUrl)}" alt="" class="w-16 h-16 rounded-xl object-cover bg-white border border-slate-200" loading="lazy">`
        : `<div class="w-16 h-16 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-slate-400 text-xs">No<br>Image</div>`;

      const priceHtml = (item.price !== null && item.price !== undefined)
        ? `<div class="text-sm font-bold">${escapeHtml(formatYen(item.price))}</div>`
        : "";

      const releaseHtml = item.releaseDate
        ? `<div class="text-xs text-slate-600 mt-1">発売日: ${escapeHtml(item.releaseDate)}</div>`
        : "";

      const purchaseHtml = item.purchasesLastMonth
        ? `<div class="text-xs text-slate-600 mt-1">先月の購入: ${escapeHtml(item.purchasesLastMonth)}</div>`
        : "";

      const asinHtml = item.asin
        ? `<div class="text-xs text-slate-500 mt-0.5">ASIN: ${escapeHtml(item.asin)}</div>`
        : "";

      const brandChip = (() => {
        if (!showBrandChip) return "";
        const colors = getBrandColors(item.brand || "Unknown");
        return `
          <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold border"
            style="background:${colors.bg}; border-color:${colors.border}; color:${colors.text}">
            ${escapeHtml(item.brand || "Unknown")}
          </span>
        `;
      })();

      card.innerHTML = `
        ${imgHtml}
        <div class="min-w-0 flex-1">
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0">${brandChip}</div>
            ${url ? `<div class="text-xs text-slate-600 inline-flex items-center gap-1 shrink-0"><i class="fa-solid fa-arrow-up-right-from-square"></i> Amazon</div>` : ``}
          </div>

          <div class="text-sm font-semibold leading-snug mt-1 line-clamp-2">${escapeHtml(item.title)}</div>

          <div class="mt-1 flex items-center justify-between gap-2">
            ${priceHtml}
          </div>

          ${releaseHtml}
          ${purchaseHtml}
          ${asinHtml}
        </div>
      `;

      card.onclick = () => {
        if (!url) return;
        window.open(url, "_blank", "noopener,noreferrer");
      };

      return card;
    }

    // -----------------------------
    // Parse (CSV/TSV paste tolerant)
    // -----------------------------
    function parsePastedText(text) {
      Papa.parse(text, {
        header: true,
        skipEmptyLines: "greedy",
        delimiter: "",      // auto-detect（CSV/TSV耐性）
        quoteChar: '"',
        escapeChar: '"',
        dynamicTyping: false,
        complete: (results) => {
          const rows = results?.data || [];
          if (!results?.meta?.fields || results.meta.fields.length === 0) {
            alert("ヘッダ行が検出できませんでした。ヘッダ行を含めてコピーして貼り付けてください。");
            resetAll();
            return;
          }
          processData(rows);
          showMain();
        },
        error: (err) => {
          console.error(err);
          alert("解析に失敗しました。貼り付けたデータ形式を確認してください。");
          resetAll();
        }
      });
    }

    // -----------------------------
    // Reset
    // -----------------------------
    function resetAll() {
      state.data = {};
      state.uniqueBrands = [];
      state.uniqueSubCats = [];
      state.filters = {
        brandSearch: "",
        subCatSearch: "",
        selectedBrand: null,
        selectedSubCat: null,
        allView: false,
        _savedSubCat: null
      };

      brandSearch.value = "";
      subCatSearch.value = "";
      brandTags.innerHTML = "";
      subCatTags.innerHTML = "";
      resultsContainer.innerHTML = "";
      updateAllViewButtonUI();

      showStart();
    }

    // -----------------------------
    // Events
    // -----------------------------
    startBtn.addEventListener("click", () => {
      const text = (csvInput.value || "").trim();
      if (!text) {
        alert("CSVデータを貼り付けてください。");
        return;
      }
      showLoading();
      setTimeout(() => parsePastedText(text), 80);
    });

    clearInputBtn.addEventListener("click", () => {
      csvInput.value = "";
      csvInput.focus();
    });

    resetBtn.addEventListener("click", resetAll);

    brandSearch.addEventListener("input", (e) => {
      state.filters.brandSearch = String(e.target.value || "");
      renderFilterTags();
      renderResults();
    });

    subCatSearch.addEventListener("input", (e) => {
      state.filters.subCatSearch = String(e.target.value || "");
      renderFilterTags();
      renderResults();
    });

    brandClearBtn.addEventListener("click", () => {
      state.filters.selectedBrand = null;
      state.filters.brandSearch = "";
      brandSearch.value = "";
      renderFilterTags();
      renderResults();
    });

    subCatClearBtn.addEventListener("click", () => {
      state.filters.selectedSubCat = null;
      state.filters.subCatSearch = "";
      subCatSearch.value = "";
      renderFilterTags();
      renderResults();
    });

    allViewBtn.addEventListener("click", () => {
      const f = state.filters;

      // トグル
      const next = !f.allView;

      if (next) {
        // ON：現状のカテゴリ選択を保存して解除（全カテゴリ表示にする）
        f._savedSubCat = f.selectedSubCat;
        f.selectedSubCat = null;
        f.allView = true;
      } else {
        // OFF：保存していたカテゴリがあれば復元（元の挙動に戻す）
        f.allView = false;
        if (!f.selectedSubCat && f._savedSubCat) {
          f.selectedSubCat = f._savedSubCat;
        }
        f._savedSubCat = null;
      }

      updateAllViewButtonUI();
      renderFilterTags();
      renderResults();
    });

    // init
    updateAllViewButtonUI();
    showStart();
  </script>
</body>
</html>
