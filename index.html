<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop Checker - Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Inter', 'Noto Sans JP', sans-serif; 
            background-color: #f1f5f9; 
            color: #334155; 
            -webkit-tap-highlight-color: transparent;
        }
        /* スクロールバー */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        .card-shadow { box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1); }
        
        /* タグアニメーション */
        .tag-active {
            transform: scale(1.02);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .tag-inactive { opacity: 0.5; }
        
        /* フェードイン */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* スマホ用調整 */
        input, textarea, button { font-size: 16px; } /* iOSでのズーム防止 */
    </style>
</head>
<body class="min-h-screen pb-20 safe-area-inset-bottom">

    <div class="max-w-3xl mx-auto px-4 py-6">
        
        <header class="mb-6 flex items-center justify-between">
            <div class="flex items-center gap-3 select-none">
                <div class="relative w-12 h-12 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center shadow-lg shadow-blue-200 text-white">
                    <i class="fas fa-shopping-bag text-xl"></i>
                    <div class="absolute -bottom-1 -right-1 bg-white rounded-full p-0.5 border border-slate-100 shadow-sm">
                        <i class="fas fa-check-circle text-green-500 text-sm bg-white rounded-full"></i>
                    </div>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-800 tracking-tight leading-none">Shop Checker</h1>
                    <p class="text-[10px] text-slate-500 font-bold mt-1 tracking-wide uppercase">Mobile Edition</p>
                </div>
            </div>

            <button id="reload-btn" onclick="resetApp()" class="hidden text-slate-400 hover:text-blue-600 w-10 h-10 flex items-center justify-center rounded-full bg-white border border-slate-200 shadow-sm transition-colors">
                <i class="fas fa-redo"></i>
            </button>
        </header>

        <div id="start-screen" class="fade-in space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <label for="csv-input" class="block text-sm font-bold text-slate-700 mb-2 flex items-center gap-2">
                    <i class="fas fa-paste text-blue-500"></i> CSVデータを貼り付け
                </label>
                <textarea id="csv-input" 
                    class="w-full h-48 p-4 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono focus:ring-2 focus:ring-blue-500 focus:bg-white focus:border-transparent outline-none transition-all resize-none placeholder-slate-400"
                    placeholder="ここにデータをペーストしてください&#13;&#10;例:&#13;&#10;&quot;新品: 現在価格&quot;,&quot;ブランド&quot;..."></textarea>
                
                <div class="mt-4">
                    <button onclick="handlePasteData()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-200 active:scale-95 transition-transform flex items-center justify-center gap-2">
                        <i class="fas fa-search"></i> 解析スタート
                    </button>
                </div>
            </div>
            
            <p class="text-center text-xs text-slate-400">
                KeepaなどのCSVデータを開き、<br>「すべて選択」→「コピー」して貼り付けてください。
            </p>
        </div>

        <div id="loading" class="hidden flex-col items-center justify-center py-20 fade-in">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-100 border-t-blue-600 mb-4"></div>
            <p class="text-slate-500 text-sm font-medium animate-pulse">解析中...</p>
        </div>

        <div id="main-content" class="hidden space-y-6 fade-in">
            
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="border-b border-slate-100">
                    <div class="px-4 py-3 bg-slate-50/80 flex items-center justify-between border-b border-slate-50">
                        <div class="font-bold text-slate-700 flex items-center gap-2 text-xs uppercase tracking-wider">
                            <i class="fas fa-certificate text-blue-500"></i> Brand
                        </div>
                        <button id="reset-brand" class="hidden text-[10px] bg-white border border-red-200 text-red-500 px-2 py-1 rounded shadow-sm">
                            クリア
                        </button>
                    </div>
                    <div class="p-3">
                        <input type="text" id="search-brand" placeholder="ブランド検索..." class="w-full text-sm border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-100 pl-3 py-2 outline-none border mb-2">
                        <div id="list-brand" class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto custom-scrollbar p-1"></div>
                    </div>
                </div>

                <div>
                    <div class="px-4 py-3 bg-slate-50/80 flex items-center justify-between border-b border-slate-50">
                        <div class="font-bold text-slate-700 flex items-center gap-2 text-xs uppercase tracking-wider">
                            <i class="fas fa-tags text-pink-500"></i> Category
                        </div>
                        <button id="reset-subcat" class="hidden text-[10px] bg-white border border-red-200 text-red-500 px-2 py-1 rounded shadow-sm">
                            クリア
                        </button>
                    </div>
                    <div class="p-3">
                        <input type="text" id="search-subcat" placeholder="カテゴリ検索..." class="w-full text-sm border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-pink-100 pl-3 py-2 outline-none border mb-2">
                        <div id="list-subcat" class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto custom-scrollbar p-1"></div>
                    </div>
                </div>
                
                <div class="bg-slate-50 px-4 py-2 text-center border-t border-slate-200">
                    <span id="status-text" class="text-xs font-bold text-slate-500"></span>
                </div>
            </div>

            <div id="results-container" class="space-y-4 pb-10"></div>
        </div>

    </div>

    <script>
        // --- 設定・状態 ---
        const state = {
            data: {},
            filters: {
                brandSearch: '', subCatSearch: '',
                selectedBrand: null, selectedSubCat: null
            },
            uniqueBrands: [],
            uniqueSubCats: []
        };

        const els = {
            csvInput: document.getElementById('csv-input'),
            startScreen: document.getElementById('start-screen'),
            loading: document.getElementById('loading'),
            mainContent: document.getElementById('main-content'),
            reloadBtn: document.getElementById('reload-btn'),
            
            listBrand: document.getElementById('list-brand'),
            listSubcat: document.getElementById('list-subcat'),
            searchBrand: document.getElementById('search-brand'),
            searchSubcat: document.getElementById('search-subcat'),
            resetBrand: document.getElementById('reset-brand'),
            resetSubcat: document.getElementById('reset-subcat'),
            statusText: document.getElementById('status-text'),
            resultsContainer: document.getElementById('results-container')
        };

        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return unsafe;
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function getBrandColors(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            const hue = Math.abs(hash % 360);
            return {
                border: `hsl(${hue}, 70%, 50%)`,
                bg: `hsl(${hue}, 85%, 96%)`,
                text: `hsl(${hue}, 70%, 30%)`
            };
        }

        // --- メイン処理 ---
        function handlePasteData() {
            const text = els.csvInput.value.trim();
            if (!text) {
                alert('データを貼り付けてください');
                return;
            }

            els.startScreen.classList.add('hidden');
            els.loading.classList.remove('hidden');
            els.loading.classList.add('flex');

            // 状態リセット
            state.filters = { brandSearch: '', subCatSearch: '', selectedBrand: null, selectedSubCat: null };
            els.searchBrand.value = '';
            els.searchSubcat.value = '';

            // 少し待ってから処理（UIブロック回避）
            setTimeout(() => {
                Papa.parse(text, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        processData(results.data);
                        els.loading.classList.add('hidden');
                        els.loading.classList.remove('flex');
                        els.mainContent.classList.remove('hidden');
                        els.reloadBtn.classList.remove('hidden');
                    },
                    error: function(err) {
                        alert('解析エラー: ' + err.message);
                        resetApp();
                    }
                });
            }, 100);
        }

        function resetApp() {
            els.csvInput.value = '';
            els.mainContent.classList.add('hidden');
            els.reloadBtn.classList.add('hidden');
            els.loading.classList.add('hidden');
            els.loading.classList.remove('flex');
            els.startScreen.classList.remove('hidden');
            els.resultsContainer.innerHTML = '';
        }

        // --- データ処理 ---
        function processData(rows) {
            const grouped = {};
            const brandsSet = new Set();
            const subCatsSet = new Set();
            let totalCount = 0;

            rows.forEach(item => {
                const brand = (item['ブランド'] || 'Unknown').trim();
                const subCat = (item['カテゴリ: サブ'] || 'その他').trim();
                
                brandsSet.add(brand);
                subCatsSet.add(subCat);

                let imgUrl = item['画像'] ? item['画像'].split(';')[0] : '';
                const rawPrice = item['新品: 現在価格'];
                const price = rawPrice ? rawPrice : '-';
                const releaseDate = item['発売日'] || '-';

                if (!grouped[brand]) grouped[brand] = {};
                if (!grouped[brand][subCat]) grouped[brand][subCat] = [];

                grouped[brand][subCat].push({
                    title: item['商品名'] || 'No Title',
                    asin: item['ASIN'] || '',
                    price: price,
                    image: imgUrl,
                    date: releaseDate
                });
                totalCount++;
            });

            if (totalCount === 0) {
                alert('有効なデータが見つかりませんでした。テキストの内容を確認してください。');
                resetApp();
                return;
            }

            state.data = grouped;
            state.uniqueBrands = Array.from(brandsSet).sort();
            state.uniqueSubCats = Array.from(subCatsSet).sort();

            initFilters();
            renderResults();
        }

        // --- フィルター機能 ---
        function initFilters() {
            // ブランドリスト
            els.listBrand.innerHTML = '';
            state.uniqueBrands.forEach(brand => {
                const btn = document.createElement('button');
                const colors = getBrandColors(brand);
                btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold border mb-1 mr-1 bg-white text-slate-600 border-slate-200 transition-all touch-manipulation';
                btn.textContent = brand;
                btn.dataset.colorBorder = colors.border;
                btn.dataset.colorBg = colors.bg;
                btn.dataset.colorText = colors.text;

                btn.onclick = () => {
                    state.filters.selectedBrand = (state.filters.selectedBrand === brand) ? null : brand;
                    updateFilterUI();
                    renderResults();
                };
                els.listBrand.appendChild(btn);
            });

            // サブカテゴリリスト
            els.listSubcat.innerHTML = '';
            state.uniqueSubCats.forEach(subCat => {
                const btn = document.createElement('button');
                btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold border mb-1 mr-1 bg-white text-slate-600 border-slate-200 transition-all touch-manipulation';
                btn.textContent = subCat;
                
                btn.onclick = () => {
                    state.filters.selectedSubCat = (state.filters.selectedSubCat === subCat) ? null : subCat;
                    updateFilterUI();
                    renderResults();
                };
                els.listSubcat.appendChild(btn);
            });

            els.searchBrand.oninput = (e) => { state.filters.brandSearch = e.target.value.toLowerCase(); updateFilterUI(); renderResults(); };
            els.searchSubcat.oninput = (e) => { state.filters.subCatSearch = e.target.value.toLowerCase(); updateFilterUI(); renderResults(); };
            
            els.resetBrand.onclick = () => { state.filters.selectedBrand = null; updateFilterUI(); renderResults(); };
            els.resetSubcat.onclick = () => { state.filters.selectedSubCat = null; updateFilterUI(); renderResults(); };
            
            updateFilterUI();
        }

        function updateFilterUI() {
            Array.from(els.listBrand.children).forEach(btn => {
                const brand = btn.textContent;
                const match = brand.toLowerCase().includes(state.filters.brandSearch);
                btn.style.display = match ? 'inline-block' : 'none';

                if (state.filters.selectedBrand === brand) {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold border mb-1 mr-1 tag-active transition-all';
                    btn.style.backgroundColor = btn.dataset.colorBg;
                    btn.style.borderColor = btn.dataset.colorBorder;
                    btn.style.color = btn.dataset.colorText;
                } else {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold border mb-1 mr-1 bg-white text-slate-600 border-slate-200 transition-all ' + (state.filters.selectedBrand ? 'tag-inactive' : '');
                    btn.style.backgroundColor = '';
                    btn.style.borderColor = '';
                    btn.style.color = '';
                }
            });

            Array.from(els.listSubcat.children).forEach(btn => {
                const subCat = btn.textContent;
                const match = subCat.toLowerCase().includes(state.filters.subCatSearch);
                btn.style.display = match ? 'inline-block' : 'none';

                if (state.filters.selectedSubCat === subCat) {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold border mb-1 mr-1 tag-active transition-all';
                    btn.style.backgroundColor = '#fce7f3';
                    btn.style.borderColor = '#db2777';
                    btn.style.color = '#db2777';
                } else {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold border mb-1 mr-1 bg-white text-slate-600 border-slate-200 transition-all ' + (state.filters.selectedSubCat ? 'tag-inactive' : '');
                    btn.style.backgroundColor = '';
                    btn.style.borderColor = '';
                    btn.style.color = '';
                }
            });

            els.resetBrand.classList.toggle('hidden', !state.filters.selectedBrand);
            els.resetSubcat.classList.toggle('hidden', !state.filters.selectedSubCat);
        }

        // --- 結果表示 ---
        function renderResults() {
            els.resultsContainer.innerHTML = '';
            
            const hasFilter = state.filters.selectedBrand || state.filters.selectedSubCat || state.filters.brandSearch || state.filters.subCatSearch;
            let totalVisibleItems = 0;
            const sortedBrands = Object.keys(state.data).sort();

            sortedBrands.forEach(brand => {
                if (state.filters.selectedBrand && state.filters.selectedBrand !== brand) return;
                if (state.filters.brandSearch && !brand.toLowerCase().includes(state.filters.brandSearch)) return;

                const brandData = state.data[brand];
                const colors = getBrandColors(brand);

                const validSubCats = Object.keys(brandData).sort().filter(subCat => {
                    if (state.filters.selectedSubCat && state.filters.selectedSubCat !== subCat) return false;
                    if (state.filters.subCatSearch && !subCat.toLowerCase().includes(state.filters.subCatSearch)) return false;
                    return true;
                });

                if (validSubCats.length === 0) return;

                const itemCount = validSubCats.reduce((sum, sc) => sum + brandData[sc].length, 0);
                totalVisibleItems += itemCount;

                // セクション（スマホ向けにシンプル化）
                const section = document.createElement('div');
                section.className = 'bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden fade-in';

                const header = document.createElement('button');
                header.type = "button";
                header.className = 'w-full flex items-center justify-between p-4 bg-white active:bg-slate-50 transition-colors text-left border-b border-slate-100';
                header.style.borderLeft = `5px solid ${colors.border}`;

                header.innerHTML = `
                    <div class="pointer-events-none overflow-hidden">
                        <h3 class="text-lg font-bold text-slate-800 truncate">${escapeHtml(brand)}</h3>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded inline-block mt-1" style="background:${colors.bg}; color:${colors.text}">${itemCount} Items</span>
                    </div>
                    <div class="w-8 h-8 flex items-center justify-center text-slate-400">
                        <i class="fas fa-chevron-down transition-transform duration-300 toggle-icon"></i>
                    </div>
                `;

                const content = document.createElement('div');
                content.className = 'p-4 space-y-6 bg-white';
                
                if (hasFilter) {
                    content.classList.remove('hidden');
                    header.querySelector('.toggle-icon').style.transform = 'rotate(0deg)';
                } else {
                    content.classList.add('hidden');
                    header.querySelector('.toggle-icon').style.transform = 'rotate(-90deg)';
                }

                header.onclick = () => {
                    const isHidden = content.classList.contains('hidden');
                    if (isHidden) {
                        content.classList.remove('hidden');
                        header.querySelector('.toggle-icon').style.transform = 'rotate(0deg)';
                    } else {
                        content.classList.add('hidden');
                        header.querySelector('.toggle-icon').style.transform = 'rotate(-90deg)';
                    }
                };

                validSubCats.forEach(subCat => {
                    const items = brandData[subCat];
                    const subSection = document.createElement('div');
                    subSection.innerHTML = `
                        <div class="flex items-center gap-2 mb-3">
                            <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
                            <h4 class="font-bold text-sm text-slate-700">${escapeHtml(subCat)}</h4>
                        </div>
                        <div class="grid grid-cols-1 gap-3">
                            ${items.map(item => `
                                <a href="https://www.amazon.co.jp/dp/${escapeHtml(item.asin)}" target="_blank" rel="noopener" class="block bg-white border border-slate-200 rounded-lg p-3 active:border-blue-400 active:bg-blue-50 transition-all h-28 flex gap-3 overflow-hidden relative shadow-sm">
                                    <div class="w-20 flex-shrink-0 flex items-center justify-center bg-slate-50 rounded p-1">
                                        ${item.image ? `<img src="${escapeHtml(item.image)}" class="max-w-full max-h-full object-contain mix-blend-multiply">` : '<span class="text-[10px] text-slate-300">No Img</span>'}
                                    </div>
                                    <div class="flex-1 flex flex-col justify-between min-w-0 py-0.5">
                                        <p class="text-xs font-bold text-slate-700 line-clamp-2 leading-snug" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</p>
                                        <div>
                                            <div class="flex justify-between items-end">
                                                <span class="text-base font-bold text-red-600">¥${item.price !== '-' ? Number(String(item.price).replace(/,/g,'')).toLocaleString() : '-'}</span>
                                            </div>
                                            <div class="flex justify-between text-[10px] text-slate-400 mt-1">
                                                <span>${escapeHtml(item.date)}</span>
                                                <span class="font-mono">${escapeHtml(item.asin)}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="absolute top-2 right-2 text-blue-300 text-[10px]">
                                        <i class="fas fa-external-link-alt"></i>
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    `;
                    content.appendChild(subSection);
                });

                section.appendChild(header);
                section.appendChild(content);
                els.resultsContainer.appendChild(section);
            });

            els.statusText.textContent = `表示中: ${totalVisibleItems} 商品`;
        }
    </script>
</body>
</html>
